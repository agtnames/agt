name: release

# Publishes the four npm packages and re-lists the MCP server (#362, epic #359).
#
#   tag push resolver-v* / countersign-v* / mcp-v* / snap-v*   or   Actions → release → Run workflow (dry_run on by default)
#
# Every run walks resolver → countersign → mcp → snap and publishes each package whose exact package.json version is not
# on npm yet (a tag only triggers; the versions in the tree decide what ships). Publishing uses npm trusted
# publishing (OIDC, provenance attestation, no token): the owner configures the trusted publisher once per package
# on npmjs.com (repository agtnames/agt, workflow release.yml). The mcp package goes through
# scripts/publish-mcp.mjs, which flips file: dependencies to registry ranges and enforces the version gates on
# server.json / smithery.yaml / gemini-extension.json. Then mcp-publisher re-lists com.agtnames/agt in the official
# MCP registry (DNS-verified namespace: apex TXT record on agtnames.com + the MCP_DNS_PRIVATE_KEY secret), and Smithery is re-published when SMITHERY_TOKEN and SMITHERY_TARGET_URL exist.
# The snap package (MetaMask Snap, D-028) is built with mm-snap and published only if the committed snap.manifest.json
# shasum matches the fresh bundle; every new version must then be re-submitted to the MetaMask Snaps Directory by hand.
# The job summary lists what is left to do by hand (plugin pin, README "Listed in", GitHub topics, Snaps Directory).

on:
  push:
    tags:
      - "resolver-v*"
      - "countersign-v*"
      - "mcp-v*"
      - "snap-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "npm publish --dry-run and mcp-publisher login only"
        type: boolean
        default: true
      package:
        description: "Limit to one package (resolver | countersign | mcp | snap); empty = every package whose version is new"
        type: string
        default: ""

permissions:
  id-token: write      # npm trusted publishing (mcp-publisher uses the DNS key, not OIDC)
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Provenance attestations are only accepted for PUBLIC source repositories (npm answers 422 otherwise, seen
  # 2026-09-21 while the packages still lived in the private site repo). Enabled automatically while this repo is public; trusted publishing
  # itself works either way. Laptop publishes are unaffected (no publishConfig.provenance in the packages).
  NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
  ONLY: ${{ inputs.package }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm 11.5+ (trusted publishing)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Decide what is new
        id: plan
        run: |
          set -e
          for p in resolver countersign mcp snap; do
            NAME=$(node -p "require('./packages/$p/package.json').name")
            VER=$(node -p "require('./packages/$p/package.json').version")
            if [ -n "$ONLY" ] && [ "$ONLY" != "$p" ]; then echo "$p: skipped (package input = $ONLY)"; echo "${p}=skip" >> "$GITHUB_OUTPUT"; continue; fi
            if npm view "$NAME@$VER" version >/dev/null 2>&1; then
              echo "$p: $NAME@$VER already on npm"; echo "${p}=skip" >> "$GITHUB_OUTPUT"
            else
              echo "$p: $NAME@$VER is new"; echo "${p}=publish" >> "$GITHUB_OUTPUT"
            fi
            echo "${p}_version=$VER" >> "$GITHUB_OUTPUT"
            echo "${p}_name=$NAME" >> "$GITHUB_OUTPUT"
          done

      - name: Publish @agtnames/resolver
        if: ${{ steps.plan.outputs.resolver == 'publish' }}
        working-directory: packages/resolver
        run: |
          npm ci
          if [ "$DRY_RUN" = "true" ]; then npm publish --dry-run --access public; else npm publish --access public; fi

      - name: Publish @agtnames/countersign
        if: ${{ steps.plan.outputs.countersign == 'publish' }}
        working-directory: packages/countersign
        run: |
          npm ci
          if [ "$DRY_RUN" = "true" ]; then npm publish --dry-run --access public; else npm publish --access public; fi

      - name: Publish @agtnames/mcp (through scripts/publish-mcp.mjs)
        if: ${{ steps.plan.outputs.mcp == 'publish' }}
        run: |
          # publish-mcp.mjs rewrites file:../resolver and file:../countersign to the ranges of the versions in the tree;
          # those versions must be on npm, which the two steps above guarantee on a fresh run.
          (cd packages/resolver && npm ci && npm run build)
          (cd packages/countersign && npm ci && npm run build)
          (cd packages/mcp && npm ci)
          if [ "$DRY_RUN" = "true" ]; then node scripts/publish-mcp.mjs --dry-run; else node scripts/publish-mcp.mjs; fi

      - name: Publish @agtnames/snap (MetaMask Snap)
        if: ${{ steps.plan.outputs.snap == 'publish' }}
        working-directory: packages/snap
        run: |
          # Depends on @agtnames/resolver from the registry (a registry range, never file:; prepublishOnly re-checks).
          # mm-snap manifest fails when the committed shasum does not match the fresh bundle, so a stale manifest never ships.
          npm ci
          npm run build
          npx mm-snap manifest
          if [ "$DRY_RUN" = "true" ]; then npm publish --dry-run --access public; else npm publish --access public; fi

      - name: Wait for npm to serve the new mcp tarball
        if: ${{ steps.plan.outputs.mcp == 'publish' && env.DRY_RUN != 'true' }}
        env:
          MCP_NAME: ${{ steps.plan.outputs.mcp_name }}
          MCP_VERSION: ${{ steps.plan.outputs.mcp_version }}
        run: |
          # npm publishes the packument (metadata) seconds after PUT, but the CDN serves the .tgz a minute or two
          # later; `npm view … mcpName` reads the packument, so it can pass while `npx @agtnames/mcp@<v>` still 404s
          # on the tarball, which then reddens the downstream agt-plugins CI (#13). Gate on the tarball being
          # fetchable, not just the metadata, then confirm mcpName for the registry ownership check that follows.
          for i in $(seq 1 30); do
            url="$(npm view "$MCP_NAME@$MCP_VERSION" dist.tarball 2>/dev/null)"
            if [ -n "$url" ] && [ "$(curl -s -o /dev/null -w '%{http_code}' -IL "$url")" = "200" ]; then
              echo "npm serves the $MCP_VERSION tarball ($url)"
              if npm view "$MCP_NAME@$MCP_VERSION" mcpName 2>/dev/null | grep -q "com.agtnames/agt"; then
                echo "mcpName present"
              else
                echo "::warning::tarball is live but mcpName is not visible yet; mcp-publisher may reject the ownership check"
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::npm did not serve the $MCP_VERSION tarball within 5 minutes; mcp-publisher may reject the ownership check and downstream npx installs may 404 briefly"

      - name: Install mcp-publisher
        if: ${{ steps.plan.outputs.mcp == 'publish' || env.DRY_RUN == 'true' }}
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version || true

      - name: Re-list in the official MCP registry
        if: ${{ steps.plan.outputs.mcp == 'publish' || env.DRY_RUN == 'true' }}
        working-directory: packages/mcp
        env:
          MCP_DNS_PRIVATE_KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY }}
        run: |
          # com.agtnames/* is DNS-verified: apex TXT "v=MCPv1; k=ed25519; p=<pubkey>" on agtnames.com, Ed25519 seed (64 hex) in the secret.
          test -n "$MCP_DNS_PRIVATE_KEY" || { echo "::error::MCP_DNS_PRIVATE_KEY secret is not set"; exit 1; }
          mcp-publisher login dns --domain agtnames.com --private-key "$MCP_DNS_PRIVATE_KEY"
          if [ "$DRY_RUN" = "true" ]; then echo "dry run: logged in; skipping mcp-publisher publish"; else mcp-publisher publish; fi

      - name: Re-publish on Smithery (only with a token and a hosted URL)
        if: ${{ steps.plan.outputs.mcp == 'publish' && env.DRY_RUN != 'true' && env.SMITHERY_API_KEY != '' && env.SMITHERY_TARGET_URL != '' }}
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_TOKEN }}
          SMITHERY_TARGET_URL: ${{ vars.SMITHERY_TARGET_URL }}
        run: |
          # @smithery/cli 4.x: `smithery mcp publish <url|bundle> -n <org/name>`. Token env name unverified against
          # the CLI's docs; `auth whoami` fails loudly if it is wrong, before anything is published.
          npx -y @smithery/cli@4 auth whoami
          npx -y @smithery/cli@4 mcp publish "$SMITHERY_TARGET_URL" -n agtnames/agt

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "## release ${{ github.ref_name }}${{ env.DRY_RUN == 'true' && ' (dry run)' || '' }}"
            echo
            echo "| package | version | action |"
            echo "|---|---|---|"
            echo "| @agtnames/resolver | ${{ steps.plan.outputs.resolver_version }} | ${{ steps.plan.outputs.resolver }} |"
            echo "| @agtnames/countersign | ${{ steps.plan.outputs.countersign_version }} | ${{ steps.plan.outputs.countersign }} |"
            echo "| @agtnames/mcp | ${{ steps.plan.outputs.mcp_version }} | ${{ steps.plan.outputs.mcp }} |"
            echo "| @agtnames/snap | ${{ steps.plan.outputs.snap_version }} | ${{ steps.plan.outputs.snap }} |"
            echo
            if [ "${{ steps.plan.outputs.snap }}" = "publish" ] && [ "$DRY_RUN" != "true" ]; then
              echo "### By hand after a real snap publish"
              echo "- re-submit \`@agtnames/snap@${{ steps.plan.outputs.snap_version }}\` to the MetaMask Snaps Directory (update form; users cannot install a version that is not allowlisted)"
              echo
            fi
            echo "### By hand after a real mcp publish"
            echo "- pin \`@agtnames/mcp@${{ steps.plan.outputs.mcp_version }}\` in agtnames/agt-plugins \`.mcp.json\` and tag \`v${{ steps.plan.outputs.mcp_version }}\`"
            echo "- check registry.modelcontextprotocol.io/v0.1/servers?search=agt shows the new version; paste listing URLs into packages/mcp/README.md \"Listed in\""
            echo "- Smithery re-reads smithery.yaml from the default branch; re-publish from the server page if it lags"
            echo "- GitHub topics on agtnames/agt: mcp-server, model-context-protocol, gemini-cli-extension, agent-skills, a2a (once; the Gemini gallery and skills.sh crawl by topic)"
            echo "- Glama, PulseMCP, mcp.so pull from npm and GitHub; nothing to do unless the install command changed"
          } >> "$GITHUB_STEP_SUMMARY"
